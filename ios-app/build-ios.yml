name: Build iOS App (IPA & Simulator)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build for Physical Device (IPA)
      run: |
        if [ -d "ios-app" ]; then
          cd ios-app
        fi
        
        xcodebuild -project SleepysBackscreen.xcodeproj \
          -scheme SleepysBackscreen \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
          clean build

        # Package into IPA
        mkdir -p Payload
        cp -r build/Release-iphoneos/SleepysBackscreen.app Payload/
        zip -r SleepysBackscreen.ipa Payload

    - name: Build for iOS Simulator (Appetize / Virtual Device)
      run: |
        if [ -d "ios-app" ]; then
          cd ios-app
        fi

        xcodebuild -project SleepysBackscreen.xcodeproj \
          -scheme SleepysBackscreen \
          -configuration Debug \
          -sdk iphonesimulator \
          CONFIGURATION_BUILD_DIR=build/Debug-iphonesimulator \
          clean build

        cd build/Debug-iphonesimulator
        zip -r ../../SleepysBackscreen-Simulator-Appetize.zip SleepysBackscreen.app

    - name: Upload Real iPhone IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SleepysBackscreen-iOS-IPA
        path: |
          **/SleepysBackscreen.ipa

    - name: Upload Simulator Zip (For Appetize.io)
      uses: actions/upload-artifact@v4
      with:
        name: SleepysBackscreen-Simulator-Appetize
        path: |
          **/SleepysBackscreen-Simulator-Appetize.zip
